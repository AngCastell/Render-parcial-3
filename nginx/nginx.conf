server {
    listen 80;
    
    # Deshabilitar el acceso a archivos estáticos por defecto
    root /dev/null;
    
    # Ruta raíz - devolver 404
    location / {
        return 404;
    }
    
    # Proxy al servicio API
    location /api/ {
        proxy_pass https://api-service-5jmk.onrender.com;
        
        # Cabeceras estándar recomendadas por Render
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
