# Resolver DNS
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

server {
    listen 80;
    
    # Deshabilitar el acceso a archivos estáticos por defecto
    root /dev/null;
    
    # Ruta raíz - devolver 404
    location / {
        return 404;
    }
    
    # Proxy al servicio API
    location /api/ {
        proxy_pass https://api-service-5jmk.onrender.com;
        
        # Configuración SSL para proxy (necesario para Render)
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name api-service-5jmk.onrender.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse on;
        
        # Timeouts aumentados (Render puede tardar en reactivar servicios gratuitos)
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        
        # Buffers para mejorar el rendimiento
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Manejo de errores y reintentos
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 30s;
        
        # Cabeceras estándar recomendadas por Render
        proxy_set_header Host api-service-5jmk.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        
        # Deshabilitar buffering para respuestas de error
        proxy_intercept_errors off;
    }
}
