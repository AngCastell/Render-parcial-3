# Resolver de DNS (usar el de Render, no el de Docker)
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

server{
    listen 80;
    
    # Deshabilitar el acceso a archivos estáticos por defecto
    root /dev/null;
    
    location /api/ {
        set $backend http://api-service:3000;
        # Mantener el path completo /api/ al hacer proxy
        proxy_pass $backend;
        
        # Configuración SSL para URLs HTTPS externas
        # (Se configurará dinámicamente por start.sh si es HTTPS)
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        
        # Headers estándar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Headers para asegurar que el contenido se muestre correctamente
        proxy_set_header Accept application/json;
        proxy_set_header Content-Type application/json;
        proxy_buffering off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Manejo de errores - devolver JSON en lugar de HTML
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_error;
    }
    
    location @api_error {
        default_type application/json;
        return 502 '{"error": "Bad Gateway", "message": "No se pudo conectar al servicio API. Verifica que el api-service esté funcionando."}';
    }
    
    location / {
        default_type application/json;
        return 404 '{"error": "Not Found", "message": "API disponible en /api/"}';
    }
}
