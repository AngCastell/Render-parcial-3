# Resolver de DNS (usar el de Render, no el de Docker)
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

server{
    listen 80;
    
    # Deshabilitar el acceso a archivos estáticos por defecto
    root /dev/null;
    
    location /api/ {
        set $backend http://api-service:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Headers para asegurar que el contenido se muestre correctamente
        proxy_set_header Accept application/json;
        proxy_buffering off;
    }
    
    location / {
        return 404 "API disponible en /api/";
    }
}
